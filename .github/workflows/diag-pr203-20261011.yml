name: Validate PR 203 exact head
on:
  push:
    branches: [diag/validate-pr203-20261011]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build complete workspace
        run: pnpm -r --include-workspace-root build
      - name: Test complete workspace
        run: pnpm -r --include-workspace-root test
      - name: Git diff formatting
        run: git diff --check HEAD~1 HEAD
